<div class="exam-list-container fade-in">
  <div class="header-section">
    <h1>Exams</h1>
    <button class="create-exam-btn" mat-stroked-button [routerLink]="['/create-exam']">
      <mat-icon>add_circle_outline</mat-icon> Create Exam
    </button>
  </div>
  
  <div *ngIf="loading" class="loading-container">
    <!-- <mat-progress-spinner diameter="40" mode="indeterminate"></mat-progress-spinner> -->
    <p>Loading exams...</p>
  </div>    
  
  <div *ngIf="error" class="error-message">
    <mat-icon>error</mat-icon> {{ error }}
  </div>
  
  <div *ngIf="!loading && !error">
    <div *ngIf="exams.length === 0" class="no-exams-message">
      <mat-icon>assignment_late</mat-icon>
      <p>No exams found. Create a new exam to get started.</p>
      <button mat-raised-button color="primary" [routerLink]="['/create-exam']">
        <mat-icon>add</mat-icon> Create First Exam
      </button>
    </div>
    
    <div *ngIf="exams.length > 0" class="exams-grid">
      <mat-card *ngFor="let exam of exams" class="exam-card">
        <mat-card-header>
          <mat-card-title>{{ exam.examTitle }}</mat-card-title>
          <mat-card-subtitle>Duration: {{ exam.duration }} minutes</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <p>{{ exam.examDescription }}</p>
          <div class="exam-stats">
            <div class="stat">
              <mat-icon>question_answer</mat-icon>
              <span>{{ exam.questions?.length || 0 }} Questions</span>
            </div>
          </div>
        </mat-card-content>
        <mat-card-actions>
          <button mat-button color="primary" [routerLink]="['/view-exam', exam._id]" *ngIf="exam._id">
            <mat-icon>visibility</mat-icon> View
          </button>
          <button mat-button color="accent" [routerLink]="['/edit-exam', exam._id]" *ngIf="exam._id">
            <mat-icon>edit</mat-icon> Edit
          </button>
          <button mat-button color="warn" (click)="deleteExam(exam._id!)" *ngIf="exam._id">
            <mat-icon>delete</mat-icon> Delete
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>
</div>
