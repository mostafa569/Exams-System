<div class="login-container fade-in">
  <mat-card>
    <div class="login-logo">
      <mat-icon color="primary" class="logo-icon">school</mat-icon>
    </div>
    
    <mat-card-title>Exam Management System</mat-card-title>
    
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" required>
          <mat-icon matSuffix>person</mat-icon>
          <mat-error *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
            Username is required
          </mat-error>
        </mat-form-field>
        
        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" required>
          <mat-icon matSuffix>lock</mat-icon>
          <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            Password is required
          </mat-error>
        </mat-form-field>
        
        <div *ngIf="error" class="error">
          {{ error }}
        </div>
        
        <div *ngIf="isLoading" class="login-spinner">
          <mat-spinner diameter="30"></mat-spinner>
        </div>
        
        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid || isLoading">
          <mat-icon>login</mat-icon> Login
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
